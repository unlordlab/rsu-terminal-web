<!DOCTYPE html>
<html lang="es" data-theme="dark-pro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSU Terminal</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0d">
  <link rel="apple-touch-icon" href="/assets/logo-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RSU Terminal">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/themes/base.css">
  <link rel="stylesheet" href="/themes/crt.css">
  <link rel="stylesheet" href="/themes/dark-pro.css">
  <link rel="stylesheet" href="/themes/light.css">
  <link rel="stylesheet" href="/themes/bubblebath.css">
  <link rel="stylesheet" href="/themes/polygon-window.css">
  <link rel="stylesheet" href="/themes/xtal.css">
  <link rel="stylesheet" href="/themes/isopropophlex.css">
  <link rel="stylesheet" href="/themes/octogon.css">

  <style>
    #app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: var(--topbar-h) 1fr;
      min-height: 100vh;
    }

    #sidebar {
      grid-row: 1 / 3;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
    }

    #topbar {
      grid-column: 2;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 1rem;
    }

    #main {
      grid-column: 2;
      padding: 1.5rem;
      overflow-y: auto;
    }

    #view {
      max-width: 1400px;
    }

    /* ── Móvil ──────────────────────────────────────────────────────────
       A 375px la terminal no se podía usar: el grid pedía 220px fijos de
       barra lateral pasara lo que pasara, así que la página entera
       desbordaba 333px (contenido de 708px en un viewport de 375) y
       scrolleaba en horizontal. Las tablas NO eran la causa: ya tienen su
       propio overflow-x. Era el armazón.

       Por debajo de 768px la barra lateral sale del flujo y pasa a ser un
       cajón que se despliega desde la izquierda con el botón ☰ de la barra
       superior. El contenido recupera el ancho completo. Ver auditoría de
       Infraestructura, hallazgo #19. */
    @media (max-width: 768px) {
      #app {
        grid-template-columns: 1fr;
      }

      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: var(--sidebar-w);
        max-width: 82vw;          /* que siempre se vea algo del fondo detrás */
        z-index: 1000;
        transform: translateX(-100%);
        transition: transform .22s ease;
        will-change: transform;
      }

      #app.nav-abierta #sidebar {
        transform: translateX(0);
      }

      /* El velo cierra el cajón al tocar fuera, que es lo que espera
         cualquiera en un móvil. Vive siempre en el DOM y solo se muestra
         con el cajón abierto -- así la transición tiene de dónde salir. */
      #nav-velo {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .55);
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity .22s ease;
      }

      #app.nav-abierta #nav-velo {
        opacity: 1;
        pointer-events: auto;
      }

      #topbar, #main {
        grid-column: 1;
      }

      #topbar {
        padding: 0 0.75rem;
        gap: 0.5rem;
      }

      #main {
        padding: 1rem 0.75rem;
      }

      /* Sin esto, un hijo ancho (una tabla, un gráfico) estira el grid en
         vez de scrollear dentro de su contenedor: `min-width:auto` es el
         valor por defecto de un item de grid y le deja crecer. Va también
         en #topbar, que era quien de verdad estiraba la columna. */
      #topbar, #main, #view {
        min-width: 0;
      }

      /* La cinta de cotizaciones se oculta en móvil. Es decorativa, no
         cabe, y encima anima en bucle: en un teléfono solo gasta batería.
         Los mismos datos están en Market, a un toque. */
      #topbar > div:first-of-type {
        display: none;
      }

      /* El grupo de la derecha tenía flex-shrink:0 en todos sus hijos, así
         que no cabía en 375px y estiraba la columna entera del grid. Se le
         deja envolver y se esconde lo que en un móvil no aporta: el reloj
         (lo tiene el propio teléfono), el texto de estado del mercado (el
         punto de color ya lo dice) y el aviso de precios. */
      #topbar > div:last-of-type {
        margin-left: auto;
        gap: 0.4rem;
      }

      #topbar-time,
      #market-status,
      #pricing-info-btn {
        display: none;
      }

      #theme-toggle {
        display: none;   /* el tema se cambia una vez, no desde el móvil */
      }
    }

    /* El botón del cajón solo existe en móvil: en escritorio la barra
       lateral está siempre visible y sobraría. */
    #nav-toggle { display: none; }

    @media (max-width: 768px) {
      #nav-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: 1px solid var(--color-border);
        color: var(--color-muted);
        border-radius: var(--radius);
        /* 40px de lado: por debajo de eso el dedo falla más de lo que
           acierta. */
        width: 40px;
        height: 40px;
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
        flex-shrink: 0;
      }
    }

    @media (min-width: 769px) {
      #nav-velo { display: none; }
    }

    /* Newsfeed en pantalla estrecha. El feed y el panel de Truth Social viven
       en un grid de "1fr 340px": en un móvil de 375px eso deja el feed en unos
       20px y los titulares salen en columna de una palabra. Se apilan, y el
       panel deja de ser sticky (pegado arriba en vertical tapa el feed al
       hacer scroll). Ver auditoría de Newsfeed, #20. */
    @media (max-width: 768px) {
      #newsfeed-grid {
        grid-template-columns: 1fr !important;
      }
      #newsfeed-grid > div > div[style*="sticky"] {
        position: static !important;
      }
    }

    #back-bar {
      max-width: 1400px;
      margin-bottom: 1rem;
    }

    #global-back-btn {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-muted);
      border-radius: var(--radius);
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }

    #global-back-btn:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    .loading {
      color: var(--color-muted);
      font-size: 13px;
      padding: 2rem 0;
    }

    .loading::after {
      content: '...';
      animation: dots 1.2s steps(3, end) infinite;
    }

    @keyframes dots {
      0%   { content: '.';   }
      33%  { content: '..';  }
      66%  { content: '...'; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>
  <div id="app">
    <nav id="sidebar"></nav>
    <div id="nav-velo"></div>
    <header id="topbar"></header>
    <main id="main">
      <div id="back-bar" style="display:none;">
        <button id="global-back-btn">← VOLVER</button>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <script type="module" src="/core/router.js?v=4"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          // Falla en silencio a propósito — sin service worker, la app sigue
          // funcionando exactamente igual, solo sin las mejoras de PWA
          // (instalable, carga con caché). No debe romper nada si falla.
        });
      });
    }
  </script>
</body>
</html>
