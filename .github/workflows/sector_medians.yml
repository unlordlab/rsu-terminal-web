name: Medianas Sectoriales

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests yfinance

      - name: Run Medianas Sectoriales
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SECTOR_MEDIANS_GIST_ID: ${{ secrets.SECTOR_MEDIANS_GIST_ID }}
        run: |
          python scripts/sector_medians.py