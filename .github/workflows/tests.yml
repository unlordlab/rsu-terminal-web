name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # permite disparar manualmente desde la pestaña Actions --
                       # útil si alguna vez el trigger de push no llega a activarse

# Una tanda de commits seguidos encolaba un run por cada uno, todos
# instalando dependencias a la vez y compitiendo. Solo interesa el resultado
# del último: los anteriores se cancelan en cuanto llega otro push.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Reutiliza las ruedas ya descargadas entre ejecuciones: la
          # instalación pasaba de varios minutos a segundos, y con ella la
          # mayor parte del tiempo del job.
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Node NO es para ejecutar nada del producto: es para PARSEAR los .js del
      # frontend (tests/test_javascript_compila.py). La suite es de Python y
      # por eso no podía detectar un error de sintaxis en JavaScript -- el
      # 09/09/2026 un acento grave de más en un comentario dejó la pantalla de
      # login sin cargar, con la suite y el CI en verde.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        # La suite tarda ~8 segundos. Con 5 minutos hay margen de sobra para
        # un runner lento, y si algo se cuelga se corta ahí en vez de agotar
        # los 10 minutos del job entero y dejar un fallo sin explicación.
        timeout-minutes: 5
        run: |
          cd backend
          python -m pytest tests/ -v
