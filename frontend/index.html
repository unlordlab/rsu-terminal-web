<!DOCTYPE html>
<html lang="es" data-theme="dark-pro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSU Terminal</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0d">
  <link rel="apple-touch-icon" href="/assets/logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RSU Terminal">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/themes/base.css">
  <link rel="stylesheet" href="/themes/crt.css">
  <link rel="stylesheet" href="/themes/dark-pro.css">
  <link rel="stylesheet" href="/themes/light.css">
  <link rel="stylesheet" href="/themes/bubblebath.css">
  <link rel="stylesheet" href="/themes/polygon-window.css">
  <link rel="stylesheet" href="/themes/xtal.css">
  <link rel="stylesheet" href="/themes/isopropophlex.css">

  <style>
    #app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: var(--topbar-h) 1fr;
      min-height: 100vh;
    }

    #sidebar {
      grid-row: 1 / 3;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
    }

    #topbar {
      grid-column: 2;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 1rem;
    }

    #main {
      grid-column: 2;
      padding: 1.5rem;
      overflow-y: auto;
    }

    #view {
      max-width: 1400px;
    }

    #back-bar {
      max-width: 1400px;
      margin-bottom: 1rem;
    }

    #global-back-btn {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-muted);
      border-radius: var(--radius);
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }

    #global-back-btn:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    .loading {
      color: var(--color-muted);
      font-size: 13px;
      padding: 2rem 0;
    }

    .loading::after {
      content: '...';
      animation: dots 1.2s steps(3, end) infinite;
    }

    @keyframes dots {
      0%   { content: '.';   }
      33%  { content: '..';  }
      66%  { content: '...'; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>
  <div id="app">
    <nav id="sidebar"></nav>
    <header id="topbar"></header>
    <main id="main">
      <div id="back-bar" style="display:none;">
        <button id="global-back-btn">← VOLVER</button>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <script type="module" src="/core/router.js?v=4"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          // Falla en silencio a propósito — sin service worker, la app sigue
          // funcionando exactamente igual, solo sin las mejoras de PWA
          // (instalable, carga con caché). No debe romper nada si falla.
        });
      });
    }
  </script>
</body>
</html>
