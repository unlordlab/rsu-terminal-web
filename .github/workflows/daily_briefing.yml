name: Daily Market Briefing

on:
  schedule:
    # RESPALDO, no el disparo principal (Infraestructura #23). A las 07:00 UTC
    # el planificador de GitHub llega con horas de retraso (6 h 26 min el
    # 14/09), así que el briefing lo lanza el servidor a su hora con
    # `workflow_dispatch` (scripts/briefing_desde_vps.sh). Este se queda por si
    # el servidor no lo lanzara; si el briefing de hoy ya está publicado, el
    # primer paso lo detecta y no lo repite.
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # El servidor (cada mañana) o a mano

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # SOLO en el disparo programado. Si el servidor ya lo lanzó a su hora,
      # generarlo otra vez gastaría el cupo de Groq y REESCRIBIRÍA el briefing
      # que la gente ya ha leído con otro distinto a media tarde. Lanzado a mano
      # o por el servidor (`workflow_dispatch`) se genera siempre.
      #
      # Si el Gist no se puede leer, NO se salta: ante la duda, briefing.
      - name: ¿Ya está publicado el briefing de hoy?
        id: hoy
        if: github.event_name == 'schedule'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID:    ${{ secrets.GIST_ID }}
        run: |
          FECHA=$(curl -s -m 20 -H "Authorization: Bearer $GIST_TOKEN" "https://api.github.com/gists/${GIST_ID:-715ee0c4e571517c11fa65c5c2376c34}"             | python3 -c 'import json,sys; g=json.load(sys.stdin); print(json.loads(g["files"]["briefing.json"]["content"]).get("date",""))' 2>/dev/null || true)
          HOY=$(date -u +%Y-%m-%d)
          echo "Briefing publicado: ${FECHA:-ilegible} · hoy: $HOY"
          if [ "$FECHA" = "$HOY" ]; then
            echo "ya=1" >> "$GITHUB_OUTPUT"
            echo "Ya está publicado (lo lanzó el servidor): este disparo programado no hace nada."
          fi

      - name: Checkout
        if: steps.hoy.outputs.ya != '1'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.hoy.outputs.ya != '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.hoy.outputs.ya != '1'
        run: |
          pip install requests yfinance numpy

      - name: Generate Daily Briefing
        if: steps.hoy.outputs.ya != '1'
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GIST_TOKEN:           ${{ secrets.GIST_TOKEN }}
          GIST_ID:              ${{ secrets.GIST_ID }}
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          # ALPHA_VANTAGE_API_KEY retirado (28/07/2026): el secret nunca se
          # configuró, así que el respaldo de titulares que dependía de él
          # nunca funcionó. Sustituido por RSS directo de los medios, sin
          # clave (ver get_rss_fallback_headlines en daily_briefing.py).
          # RSU_BACKEND_URL y BRIEFING_AUTH_TOKEN retirados (10/09/2026): solo
          # servian para leer Insider Flow del backend, y los insiders salieron
          # del briefing por decision del usuario. Un secreto que el job no usa
          # es superficie expuesta sin nada a cambio.
          # Indicadores macro ya publicados (IPC, paro, nóminas, ventas
          # minoristas...). Sin esta clave el briefing se genera igual, solo
          # que sin esa sección -- ver get_macro_indicators().
          FRED_API_KEY:         ${{ secrets.FRED_API_KEY }}
          # Elige el prompt: v2 por defecto (ver PROMPT_VERSION en
          # daily_briefing.py). Poner el secret a "v1" revierte al anterior
          # sin tocar código ni desplegar.
          BRIEFING_PROMPT_VERSION: ${{ secrets.BRIEFING_PROMPT_VERSION }}
        run: |
          # `pipefail` es imprescindible: sin el, `tee` devuelve 0 y un fallo
          # del script pasaria por ejecucion correcta.
          set -o pipefail
          python scripts/daily_briefing.py 2>&1 | tee /tmp/briefing.log

      # EL AVISO LLEVA EL ERROR, no solo el numero de ejecucion.
      #
      # EL CASO, 07/09/2026: el briefing fallo y el aviso decia unicamente "ha
      # fallado (run 34125373118)". Para saber POR QUE hay que abrir el
      # registro del Action, y la API de GitHub exige permisos de admin para
      # descargarlo -- asi que el diagnostico costaba una vuelta entera.
      #
      # Se recortan las ultimas lineas y se tapan las cadenas largas que
      # parezcan una credencial: los registros del Action los enmascara GitHub,
      # pero el fichero de `tee` no, y de ahi sale este mensaje.
      - name: Avisar por Telegram si falló
        if: failure()
        continue-on-error: true
        run: |
          COLA=$(tail -n 15 /tmp/briefing.log 2>/dev/null                  | sed -E 's/[A-Za-z0-9_-]{24,}/[oculto]/g'                  | tail -c 900)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"             --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}"             --data-urlencode "text=⚠️ Daily Market Briefing ha fallado (run ${{ github.run_id }}). Sin él, el Dashboard muestra el de ayer.

          Últimas líneas:
          ${COLA}"
