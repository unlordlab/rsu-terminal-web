<!DOCTYPE html>
<html lang="es" data-theme="crt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSU Terminal</title>

  <!-- Themes: base siempre primero -->
  <link rel="stylesheet" href="/themes/base.css">
  <link rel="stylesheet" href="/themes/crt.css">
  <link rel="stylesheet" href="/themes/dark-pro.css">
  <link rel="stylesheet" href="/themes/light.css">

  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-mono);
      font-size: var(--font-size);
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: var(--scanlines);
      pointer-events: none;
      z-index: 9998;
    }
    #app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }
    #sidebar  { grid-row: 1 / 3; }
    #topbar   { grid-column: 2; }
    #main     { grid-column: 2; padding: 1.5rem; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="app">
    <nav id="sidebar"></nav>
    <header id="topbar"></header>
    <main id="main">
      <div id="view"></div>
    </main>
  </div>

  <script type="module" src="/core/router.js"></script>
</body>
</html>
