services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    restart: unless-stopped
    # Sin --reload (eso es solo para desarrollo local) y sin volumen en vivo
    # montado — el código se copia DENTRO de la imagen al hacer build (ver
    # Dockerfile), así que cada despliegue nuevo implica reconstruir la
    # imagen, no simplemente reiniciar el contenedor sobre archivos que ya
    # cambiaron por su cuenta.
    #
    # LAS BASES DE DATOS SÍ SE MONTAN COMO VOLÚMENES — a propósito, para que
    # sobrevivan a un "docker compose up -d --build". Sin esto, cada
    # despliegue nuevo borraría usuarios, historial de Options Flow,
    # seguimiento del Algoritmo, todo. Montaje archivo a archivo (no la
    # carpeta backend/ entera) para no tapar el código nuevo de cada
    # despliegue con una versión vieja cacheada en el volumen.
    volumes:
      - ./data/algoritmo_history.db:/app/backend/algoritmo_history.db
      - ./data/analytics.db:/app/backend/analytics.db
      - ./data/cache.db:/app/backend/cache.db
      - ./data/cartera_notificaciones.db:/app/backend/cartera_notificaciones.db
      - ./data/chat_historial.db:/app/backend/chat_historial.db
      - ./data/community.db:/app/backend/community.db
      - ./data/insider_history.db:/app/backend/insider_history.db
      - ./data/users.db:/app/backend/users.db
      - ./data/options_flow.db:/app/backend/options_flow.db
