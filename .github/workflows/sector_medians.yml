name: Medianas Sectoriales

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests yfinance

      - name: Run Medianas Sectoriales
        # SECTOR_MEDIANS_GIST_ID ya no se pasa: apuntaba a un Gist distinto
        # del que lee el backend, así que este job llevaba semanas saliendo
        # en verde sin que Research viera una sola mediana real (29/07/2026).
        # El ID sale ahora de shared/gist_ids.py, la misma constante que
        # importan los dos lados. El secret puede borrarse de GitHub.
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python scripts/sector_medians.py

      - name: Avisar por Telegram si falló
        if: failure()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"             -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}"             -d text="⚠️ Medianas Sectoriales: el calculo semanal ha fallado. Research cae a los benchmarks estaticos. (run ${{ github.run_id }})."
